# Keycloak Configuration - JWE SPI Settings
# These values reference environment variables from .env

archcore.jwe.default-jwks-url=${ARCHCORE_JWE_DEFAULT_JWKS_URL:http://host.docker.internal:8081/.well-known/jwks.json}
archcore.jwe.cache-ttl-ms=${ARCHCORE_JWE_CACHE_TTL_MS:300000}
archcore.jwe.algorithm=${ARCHCORE_JWE_ALGORITHM:RSA-OAEP-256}
archcore.jwe.encryption-method=${ARCHCORE_JWE_ENCRYPTION_METHOD:A256GCM}
archcore.jwe.key-id=${ARCHCORE_JWE_KEY_ID:archcore-enc-key}
