spring:
  application:
    name: archcore-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:keycloak}
    username: ${POSTGRES_USER:keycloak}
    password: ${POSTGRES_PASSWORD:gizlisifre}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/archcore-dev}

server:
  port: ${SERVER_PORT:8081}

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    info:
      enabled: true
  info:
    env:
      enabled: false

archcore:
  security:
    allowed-origins: https://localhost:3000

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      url: /api/v1/auth/.*
      rate-limits:
        - bandwidths:
            - capacity: 20
              time: 1
              unit: minutes
              refill-speed: interval
    - cache-name: rate-limit-buckets
      url: /api/v1/.*
      rate-limits:
        - bandwidths:
            - capacity: 300
              time: 1
              unit: minutes
              refill-speed: interval
