spring:
  application:
    name: archcore-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:saas_db}
    username: ${POSTGRES_USER:saas_user}
    password: ${POSTGRES_PASSWORD:saas_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/archcore-dev}
      client:
        registration:
          keycloak:
            client-id: ${ARCHCORE_CLIENT_ID:archcore-client}
            client-secret: ${ARCHCORE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/archcore-dev}

server:
  port: ${SERVER_PORT:8081}

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    info:
      enabled: true
  info:
    env:
      enabled: false

archcore:
  security:
    allowed-origins: https://localhost:3000
  rate-limit:
    enabled: true
    key-strategy: COMPOSITE
    filters:
      - url: /api/v1/auth/.*
        capacity: 20
        refill-tokens: 20
        refill-duration-seconds: 60
      - url: /api/v1/.*
        capacity: 300
        refill-tokens: 300
        refill-duration-seconds: 60
  billing:
    provider: stripe
    webhook-secret: ${BILLING_WEBHOOK_SECRET:}
  audit:
    enabled: true
    async: true
  async:
    enabled: true
    executors:
      - name: auditLog
        core-pool-size: 2
        max-pool-size: 5
        queue-capacity: 100
        thread-name-prefix: audit-log-
        await-termination-seconds: 30
      - name: default
        core-pool-size: 2
        max-pool-size: 10
        queue-capacity: 200
        thread-name-prefix: async-
        await-termination-seconds: 30
