spring:
  config:
    activate:
      on-profile: prod

spring.security.oauth2.resourceserver.jwt.issuer-uri: ${KEYCLOAK_ISSUER_URI}

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
  info:
    env:
      enabled: false

archcore:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000}
    jwe:
      private-key-location: ${JWE_PRIVATE_KEY_PATH}
      public-key-location: ${JWE_PUBLIC_KEY_PATH}
      jwe-algorithm: ${JWE_ALGORITHM:RSA-OAEP-256}
      encryption-method: ${JWE_ENCRYPTION_METHOD:A256GCM}
      key-id: ${JWE_KEY_ID:archcore-enc-key}

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      url: /api/v1/auth/.*
      rate-limits:
        - bandwidths:
            - capacity: 20
              time: 1
              unit: minutes
              refill-speed: 20
              refill-time: 1
              refill-unit: minutes
    - cache-name: rate-limit-buckets
      url: /api/v1/.*
      rate-limits:
        - bandwidths:
            - capacity: 300
              time: 1
              unit: minutes
              refill-speed: 300
              refill-time: 1
              refill-unit: minutes
